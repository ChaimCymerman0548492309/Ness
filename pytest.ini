[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --alluredir=reports/allure-results
    --html=reports/pytest-report.html
    --self-contained-html
    --junitxml=reports/junit.xml
markers =
    smoke: Quick smoke tests
    e2e: Full end-to-end scenarios
    data_driven: Tests loaded from external data files
    live_ebay: Tests that exercise the live eBay website
    mock_store: Deterministic mocked-store E2E tests
